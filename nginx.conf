server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/users/access-token/stg {
        proxy_pass https://ng-web.certifyos.com/api/users/access-token;
        proxy_ssl_server_name on;
        proxy_set_header Host ng-web.certifyos.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/users/access-token/prod {
        proxy_pass https://ng.certifyos.com/api/users/access-token;
        proxy_ssl_server_name on;
        proxy_set_header Host ng.certifyos.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/stg/ {
        proxy_pass https://ng-api-stg.certifyos.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host ng-api-stg.certifyos.com;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/prod/ {
        proxy_pass https://ng-api-production.certifyos.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host ng-api-production.certifyos.com;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
